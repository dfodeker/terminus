# internal/graphql/schema/product.graphql

type Product implements Node {
  id: ID!
  
  """
  Human-readable title
  """
  title: String!
  
  """
  URL-friendly slug
  """
  slug: String!
  
  """
  Full description (may contain HTML)
  """
  description: String
  
  """
  Product status
  """
  status: ProductStatus!
  
  """
  Price in cents (from first/default variant)
  """
  priceRange: PriceRange!
  
  """
  Compare-at price for showing discounts
  """
  compareAtPriceRange: PriceRange
  
  """
  Total inventory across all variants
  """
  totalInventory: Int!
  
  """
  Whether inventory is tracked
  """
  tracksInventory: Boolean!
  
  """
  Product variants
  """
  variants(first: Int, after: Cursor): ProductVariantConnection!
  
  """
  Product images
  """
  images(first: Int, after: Cursor): ImageConnection!
  
  """
  Featured image
  """
  featuredImage: Image
  
  """
  SEO metadata
  """
  seo: SEO!
  
  """
  Collections this product belongs to
  """
  collections(first: Int, after: Cursor): CollectionConnection!
  
  """
  Product options (Size, Color, etc.)
  """
  options: [ProductOption!]!
  
  """
  Timestamps
  """
  createdAt: DateTime!
  updatedAt: DateTime!
  publishedAt: DateTime
}

type ProductVariant implements Node {
  id: ID!
  
  """
  Parent product
  """
  product: Product!
  
  """
  Variant title (e.g., "Large / Red")
  """
  title: String!
  
  """
  Price in cents
  """
  price: Money!
  
  """
  Compare-at price
  """
  compareAtPrice: Money
  
  """
  Cost per item
  """
  cost: Money
  
  """
  Stock Keeping Unit
  """
  sku: String
  
  """
  Barcode (ISBN, UPC, etc.)
  """
  barcode: String
  
  """
  Current inventory quantity
  """
  inventoryQuantity: Int!
  
  """
  Selected options for this variant
  """
  selectedOptions: [SelectedOption!]!
  
  """
  Variant image
  """
  image: Image
  
  """
  Position in variant list
  """
  position: Int!
  
  """
  Whether this variant is available for purchase
  """
  availableForSale: Boolean!
  
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ProductOption {
  name: String!
  values: [String!]!
}

type SelectedOption {
  name: String!
  value: String!
}

type PriceRange {
  minPrice: Money!
  maxPrice: Money!
}

enum ProductStatus {
  DRAFT
  ACTIVE
  ARCHIVED
}

enum ProductSortKey {
  TITLE
  CREATED_AT
  UPDATED_AT
  PRICE
  INVENTORY_TOTAL
  BEST_SELLING
}

"""
Connection types
"""
type ProductConnection {
  edges: [ProductEdge!]!
  nodes: [Product!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ProductEdge {
  cursor: Cursor!
  node: Product!
}

type ProductVariantConnection {
  edges: [ProductVariantEdge!]!
  nodes: [ProductVariant!]!
  pageInfo: PageInfo!
}

type ProductVariantEdge {
  cursor: Cursor!
  node: ProductVariant!
}

"""
Input types
"""
input ProductInput {
  title: String
  description: String
  slug: String
  status: ProductStatus
  seo: SEOInput
  options: [String!]
}

input ProductVariantInput {
  title: String
  price: Money
  compareAtPrice: Money
  cost: Money
  sku: String
  barcode: String
  inventoryQuantity: Int
  options: [String!]
}

"""
Mutation payloads
"""
type ProductCreatePayload {
  product: Product
  userErrors: [UserError!]!
}

type ProductUpdatePayload {
  product: Product
  userErrors: [UserError!]!
}

type ProductDeletePayload {
  deletedProductId: ID
  userErrors: [UserError!]!
}

type ProductVariantCreatePayload {
  productVariant: ProductVariant
  userErrors: [UserError!]!
}

type ProductVariantUpdatePayload {
  productVariant: ProductVariant
  userErrors: [UserError!]!
}

type InventoryAdjustPayload {
  productVariant: ProductVariant
  userErrors: [UserError!]!
}

type InventorySetPayload {
  productVariant: ProductVariant
  userErrors: [UserError!]!
}