# internal/graphql/schema/schema.graphql

type Query {
  """
  Fetch any node by its global ID
  """
  node(id: ID!): Node

  """
  Fetch multiple nodes by their global IDs
  """
  nodes(ids: [ID!]!): [Node]!

  """
  Current shop context
  """
  shop: Shop!

  """
  Products
  """
  product(id: ID!): Product @requireScope(scope: "read_products")
  products(
    first: Int
    after: Cursor
    last: Int
    before: Cursor
    query: String
    sortKey: ProductSortKey
    reverse: Boolean
  ): ProductConnection! @requireScope(scope: "read_products")

  """
  Orders
  """
  order(id: ID!): Order @requireScope(scope: "read_orders")
  orders(
    first: Int
    after: Cursor
    query: String
    sortKey: OrderSortKey
    reverse: Boolean
  ): OrderConnection! @requireScope(scope: "read_orders")

  """
  Customers
  """
  customer(id: ID!): Customer @requireScope(scope: "read_customers")
  customers(
    first: Int
    after: Cursor
    query: String
    sortKey: CustomerSortKey
    reverse: Boolean
  ): CustomerConnection! @requireScope(scope: "read_customers")
}

type Mutation {
  """
  Product mutations
  """
  productCreate(input: ProductInput!): ProductCreatePayload 
    @requireScope(scope: "write_products")
  
  productUpdate(id: ID!, input: ProductInput!): ProductUpdatePayload 
    @requireScope(scope: "write_products")
  
  productDelete(id: ID!): ProductDeletePayload 
    @requireScope(scope: "write_products")

  """
  Variant mutations
  """
  productVariantCreate(productId: ID!, input: ProductVariantInput!): ProductVariantCreatePayload 
    @requireScope(scope: "write_products")
  
  productVariantUpdate(id: ID!, input: ProductVariantInput!): ProductVariantUpdatePayload 
    @requireScope(scope: "write_products")

  """
  Order mutations
  """
  orderCreate(input: OrderInput!): OrderCreatePayload 
    @requireScope(scope: "write_orders")
  
  orderUpdate(id: ID!, input: OrderUpdateInput!): OrderUpdatePayload 
    @requireScope(scope: "write_orders")
  
  orderCancel(id: ID!, reason: String): OrderCancelPayload 
    @requireScope(scope: "write_orders")

  """
  Inventory mutations
  """
  inventoryAdjust(id: ID!, delta: Int!): InventoryAdjustPayload 
    @requireScope(scope: "write_inventory")
  
  inventorySet(id: ID!, quantity: Int!): InventorySetPayload 
    @requireScope(scope: "write_inventory")

  """
  Customer mutations
  """
  customerCreate(input: CustomerInput!): CustomerCreatePayload 
    @requireScope(scope: "write_customers")
  
  customerUpdate(id: ID!, input: CustomerInput!): CustomerUpdatePayload 
    @requireScope(scope: "write_customers")

  """
  Webhook mutations
  """
  webhookCreate(input: WebhookInput!): WebhookCreatePayload 
    @requireScope(scope: "manage_webhooks")
  
  webhookDelete(id: ID!): WebhookDeletePayload 
    @requireScope(scope: "manage_webhooks")
}