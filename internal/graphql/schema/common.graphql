# internal/graphql/schema/common.graphql

"""
Global ID scalar - base64 encoded gid://storeOS/{type}/{uuid}
"""
scalar ID

"""
ISO 8601 datetime
"""
scalar DateTime

"""
Money in cents (integer)
"""
scalar Money

"""
Cursor for pagination
"""
scalar Cursor

"""
Node interface - all objects with GIDs implement this
"""
interface Node {
  id: ID!
}

"""
Standard connection pattern for pagination
"""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: Cursor
  endCursor: Cursor
}

"""
User error for mutations
"""
type UserError {
  field: [String!]
  message: String!
  code: String
}

"""
Directive for scope-based authorization
"""
directive @requireScope(scope: String!) on FIELD_DEFINITION
directive @requireAnyScope(scopes: [String!]!) on FIELD_DEFINITION